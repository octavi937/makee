<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento Diario de Maquinaria</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 15px;
        }
        .header h1 {
            color: #0056b3;
            margin: 0;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-column {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #0056b3;
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.2);
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            .checkbox-group {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }
            .form-row {
                flex-direction: column;
                gap: 15px;
            }
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }
        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }
        .item-empty {
            color: #888;
            font-style: italic;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #003d82;
        }
        .message {
            display: none;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mantenimiento Diario de Maquinaria</h1>
            <p>Formulario de registro y control de mantenimiento</p>
        </div>
        
        <form id="formularioMantenimiento" action="https://hook.us2.make.com/zt8s7euecbal3rdf0b68nfi8hrqxdsxh" method="POST">
            <div class="form-row">
                <div class="form-column">
                    <div class="form-group">
                        <label for="fecha">Fecha de mantenimiento:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>
                </div>
                <div class="form-column">
                    <div class="form-group">
                        <label for="maquina">Máquina / Equipo:</label>
                        <input type="text" id="maquina" name="maquina" required>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-column">
                    <div class="form-group">
                        <label for="realizado">Realizado por:</label>
                        <select id="realizado" name="realizado" required>
                            <option value="">Seleccione una opción</option>
                            <!-- Aquí puedes agregar tus opciones -->
                            <option value="operador1">Operador 1</option>
                            <option value="operador2">Operador 2</option>
                            <option value="tecnico1">Técnico 1</option>
                            <option value="tecnico2">Técnico 2</option>
                        </select>
                    </div>
                </div>
                <div class="form-column">
                    <div class="form-group">
                        <label for="controlado">Controlado por:</label>
                        <select id="controlado" name="controlado" required>
                            <option value="">Seleccione una opción</option>
                            <!-- Aquí puedes agregar tus opciones -->
                            <option value="supervisor1">Supervisor 1</option>
                            <option value="supervisor2">Supervisor 2</option>
                            <option value="jefe1">Jefe de Mantenimiento</option>
                            <option value="gerente1">Gerente de Operaciones</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Verificaciones realizadas:</label>
                <div class="checkbox-group">
                    <!-- Estos son espacios que puedes personalizar -->
                    <div class="checkbox-item">
                        <input type="checkbox" id="item1" name="verificaciones[]" value="item1">
                        <label for="item1">nivel de aceite de motor</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item2" name="verificaciones[]" value="item2">
                        <label for="item2">cambio filtro de combustible</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item3" name="verificaciones[]" value="item3">
                        <label for="item3">limpieza filtro de aire externo</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item4" name="verificaciones[]" value="item4">
                        <label for="item4">nivel de refrigerante radiador</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item5" name="verificaciones[]" value="item5">
                        <label for="item5">limpieza exterior radiador</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item6" name="verificaciones[]" value="item6">
                        <label for="item6">control de correa ventilador</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item7" name="verificaciones[]" value="item7">
                        <label for="item7">limpieza de aletas refrigeracion cilindro </label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item8" name="verificaciones[]" value="item8">
                        <label for="item8">control de la turbina</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item9" name="verificaciones[]" value="item9">
                        <label for="item9">revisar instalaciones electricas</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item10" name="verificaciones[]" value="item10">
                        <label for="item10">limpieza de respiradores </label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item11" name="verificaciones[]" value="item11">
                        <label for="item11">presion de neumaticos </label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item12" name="verificaciones[]" value="item12">
                        <label for="item12">control de tornillos de rueda </label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item13" name="verificaciones[]" value="item13">
                        <label for="item13">control de cantidad de combustible</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item14" name="verificaciones[]" value="item14">
                        <label for="item14">control de aceite hidraulico</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item15" name="verificaciones[]" value="item15">
                        <label for="item15">precensia de perdida de aceite</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item16" name="verificaciones[]" value="item16">
                        <label for="item16">estado de matafuego</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item17" name="verificaciones[]" value="item17">
                        <label for="item17">estado de cinturon</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="item18" name="verificaciones[]" value="item18">
                        <label for="item18">luces</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="observaciones">Observaciones adicionales:</label>
                <textarea id="observaciones" name="observaciones" rows="4"></textarea>
            </div>
            
            <div class="form-group">
                <button type="submit">Registrar mantenimiento</button>
            </div>
            
            <div id="mensajeExito" class="message success">
                ¡Registro de mantenimiento enviado correctamente!
            </div>
            
            <div id="mensajeError" class="message error">
                Ha ocurrido un error al enviar el registro. Por favor, intente nuevamente.
            </div>
        </form>
    </div>

    <script>
        document.getElementById('formularioMantenimiento').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const form = this;
            const formData = new FormData(form);
            const data = {};
            
            formData.forEach((value, key) => {
                // Manejar checkboxes (verificaciones[])
                if (key.endsWith('[]')) {
                    const cleanKey = key.slice(0, -2);
                    if (!data[cleanKey]) {
                        data[cleanKey] = [];
                    }
                    data[cleanKey].push(value);
                } else {
                    data[key] = value;
                }
            });
            
            fetch(form.action, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('mensajeExito').style.display = 'block';
                    document.getElementById('mensajeError').style.display = 'none';
                    form.reset();
                    
                    // Ocultar el mensaje después de 5 segundos
                    setTimeout(function() {
                        document.getElementById('mensajeExito').style.display = 'none';
                    }, 5000);
                } else {
                    throw new Error('Error en la respuesta del servidor');
                }
            })
            .catch(error => {
                document.getElementById('mensajeError').style.display = 'block';
                document.getElementById('mensajeExito').style.display = 'none';
                console.error('Error:', error);
                
                // Ocultar el mensaje después de 5 segundos
                setTimeout(function() {
                    document.getElementById('mensajeError').style.display = 'none';
                }, 5000);
            });
        });
    </script>
</body>
</html>
